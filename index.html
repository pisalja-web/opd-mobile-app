<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ตารางเวร OPD</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14356b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #14356b;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #box { padding: 20px; }
    #box p { margin-bottom: 18px; font-size: 15px; }
    #box a {
      display: inline-block;
      background: #fff;
      color: #14356b;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div id="box">
    <p>กำลังเปิดตารางเวร...</p>
    <a id="openLink" href=[https://script.google.com/macros/s/AKfycbyfiQD3lBAu_BMk6FvG4-m8KPywh1-dtcfQ5Gg6RsoXI-TriZIFMMYxvNcCip7j9xlE/exec?view=mobile]>กดที่นี่ถ้าไม่เด้งไปเอง</a>
  </div>

  <script>
    // ★★★ จุดที่ต้องแก้ไข มีจุดเดียว ★★★
    // เอา URL ของ Apps Script (ที่ทดสอบแล้วว่าเปิดตรง ๆ ได้ผลดี) มาแทนที่ YOUR_SCRIPT_URL_HERE
    // ทั้ง 2 ที่ต่อไปนี้ ต้องแก้ให้เหมือนกันทั้งคู่:
    //   1) ในแท็ก <a> ด้านบน ตรง href="YOUR_SCRIPT_URL_HERE"
    //   2) ในบรรทัดถัดไปนี้
    const APP_URL = [https://script.google.com/macros/s/AKfycbyfiQD3lBAu_BMk6FvG4-m8KPywh1-dtcfQ5Gg6RsoXI-TriZIFMMYxvNcCip7j9xlE/exec?view=mobile];

    document.getElementById('openLink').href = APP_URL;

    // เด้งไปเปิดอัตโนมัติทันทีที่หน้านี้โหลดเสร็จ (หน่วงไว้เล็กน้อยให้ผู้ใช้เห็นข้อความก่อน)
    setTimeout(() => {
      window.location.replace(APP_URL);
    }, 400);

    // ลงทะเบียนตัวจำการติดตั้งแอป — ส่วนนี้ไม่ต้องแก้อะไร
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.log('ลงทะเบียน service worker ไม่สำเร็จ:', err);
        });
      });
    }
  </script>

</body>
</html>
